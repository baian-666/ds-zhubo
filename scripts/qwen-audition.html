<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf" content="__CSRF_TOKEN__">
<title>小鲸鱼 · Qwen 声音试听</title>
<style>body{margin:0;padding:24px;background:#101c25;color:#e5f4f1;font:17px/1.65 system-ui}main{max-width:740px;margin:3vh auto}section{background:#192c38;padding:24px;border-radius:18px;margin:18px 0}h1{margin-bottom:0}p{margin:8px 0}small,.muted{color:#adc4ce}a{color:#8ee3d1}label{display:block;margin-top:14px}input,select,textarea,button{font:inherit;box-sizing:border-box;border-radius:9px;padding:11px}input,select,textarea{width:100%;background:#101c25;color:inherit;border:1px solid #45606c}button{background:#89dcc8;border:0;cursor:pointer;margin:12px 8px 0 0}button:disabled{opacity:.45;cursor:default}textarea{min-height:110px;resize:vertical}.row{display:flex;gap:18px}.row>*{flex:1}#stop{background:#facdb2}#result{white-space:pre-line}audio{width:100%;margin-top:12px}@media(max-width:520px){body{padding:12px}.row{display:block}}</style>
<main><h1>小鲸鱼的声音，先听再选</h1><p class="muted">Qwen 云端流式试听 · 北京地域 · qwen3-tts-flash-realtime</p>
<section><details id="credentials" open><summary>连接百炼账号</summary><p>在<a href="https://bailian.console.aliyun.com/cn-beijing/model/settings/api-key" target="_blank" rel="noreferrer">百炼北京地域</a>创建 API Key，粘贴到下面。</p><form id="setup"><label for="key">API Key</label><input id="key" type="password" autocomplete="off" spellcheck="false" maxlength="512" required><button id="save">保存并检查连接</button></form><small>密钥仅保存在本机忽略的 .env。检查连接不提交合成文本。</small></details><p id="account" role="status">正在读取配置…</p></section>
<section><div class="row"><label>音色<select id="voice"><option value="Cherry">芊悦 · 亲切女声</option><option value="Serena">苏瑶 · 温柔女声</option><option value="Chelsie">千雪 · 二次元女声</option><option value="Momo">茉兔 · 活泼女声</option><option value="Vivian">十三 · 个性女声</option></select></label><label>播放方式<select id="mode"><option value="stream">流式：边收到边播放</option><option value="full">对照：收齐后再播放</option></select></label></div>
<label for="text">试听台词</label><textarea id="text" maxlength="300">你来啦，今天有什么好玩的事情？等等，这个梗我接住了。你是不是又偷偷摸鱼了？</textarea>
<button id="play" disabled>开始试听</button><button id="stop" disabled>停止</button><p id="result" role="status">配置完成后，选一个音色就能试听。</p><audio id="replay" controls hidden></audio>
<small>点击试听会调用云端语音服务，按账号规则计费。两种播放方式每次各生成一次；对照项只是等待收齐，使用同一个流式服务。试听不更换直播间声音。</small></section>
<p class="muted">首音频到达包含网络和建连。播放排程时间不等于扬声器实际出声；若音频开头有静音，听到声音还会更晚。</p></main><script type="module" src="/qwen-audition-browser.mjs"></script></html>
